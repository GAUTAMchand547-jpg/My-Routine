name: Build Habit Protocol APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o Gautam_Habit_Protocol_Phone_Build.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: -p GautamHabitProtocolAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Gautam-Habit-Protocol-APK
          path: GautamHabitProtocolAndroid/app/build/outputs/apk/debug/app-debug.apk
